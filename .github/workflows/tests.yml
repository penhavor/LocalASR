name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies (без Qt — тесты GUI пойдут на стабе)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Syntax check
        run: python -m compileall -q app bootstrap.py main.py run_app.py scripts

      - name: Run tests
        run: python -m pytest tests -q

  gui-tests:
    name: GUI на настоящем PySide6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt pytest

      - name: Smoke GUI (offscreen)
        run: QT_QPA_PLATFORM=offscreen python scripts/dev_gui_smoke.py

      - name: Тесты
        run: python -m pytest tests -q
