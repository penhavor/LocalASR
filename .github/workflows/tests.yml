# Automatic tests on every push / pull request (GitHub Actions — free for
# public repositories). Runs the project's own runner: tests/run_all.py.
# Deleting this folder (.github/) disables CI; nothing else depends on it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt (PySide6) needs these system libraries even in offscreen mode
      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1

      # base dependencies + the engine extras that the test modules exercise
      # (without them the corresponding tests SKIP, which is also acceptable)
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.13" accelerate soundfile

      - name: Run all tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py
